[package]
name = "sumi-wasm"
version = "0.2.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sumi-core = { path = "../sumi/crates/sumi-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
# lopdf needs getrandom's wasm_js backend on wasm32-unknown-unknown.
lopdf = { version = "0.45", default-features = false, features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
